name: Deploy Playgrounds to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# No workflow-level permissions block: each job declares only what it needs,
# so the Telegram job never sees a token that can write to Pages.
permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # `npm ci` runs dependency lifecycle scripts; don't leave a usable
          # credential in .git/config while that happens. Nothing here pushes.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      # --omit=dev skips Playwright (the only devDependency, ~10 MB). Deploy
      # never captures thumbnails — that's thumbnails.yml, which does a full
      # install because it genuinely needs the browser.
      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Build Astro site
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify_telegram:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      # Every dynamic value goes through `env:` and is referenced as a shell
      # variable. Interpolating `${{ }}` straight into `run:` would splice the
      # raw text into the script before the shell ever sees it.
      - name: Notify Telegram
        env:
          BOT_TOKEN:     ${{ secrets.PIPLINE_BOT_SECRET }}
          CHAT_ID:       ${{ secrets.CHAT_ID }}
          BUILD_STATUS:  ${{ needs.build.result }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          ACTOR:         ${{ github.actor }}
          BRANCH:        ${{ github.ref_name }}
          SHA:           ${{ github.sha }}
          OWNER:         ${{ github.repository_owner }}
          REPO_NAME:     ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "No telegram secrets, skipping notification"
            exit 0
          fi

          SHORT_SHA="${SHA:0:7}"

          if [ "$BUILD_STATUS" = "success" ] && [ "$DEPLOY_STATUS" = "success" ]; then
            TEXT="@${ACTOR}%0A✅ Deployed successfully!%0ABranch: ${BRANCH}%0ACommit: ${SHORT_SHA}%0A🌐 https://${OWNER}.github.io/${REPO_NAME}/"
          elif [ "$BUILD_STATUS" != "success" ]; then
            TEXT="@${ACTOR}%0A❌ Build failed!%0ABranch: ${BRANCH}%0ACommit: ${SHORT_SHA}"
          else
            TEXT="@${ACTOR}%0A❌ Deploy failed!%0ABranch: ${BRANCH}%0ACommit: ${SHORT_SHA}"
          fi

          # --fail-with-body so a Telegram API error fails the step loudly
          # instead of passing silently; -o /dev/null keeps the response
          # (which echoes the chat id) out of the log.
          curl -sS --fail-with-body -o /dev/null \
            -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="$TEXT"
