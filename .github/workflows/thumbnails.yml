name: Regenerate Thumbnails

# Manual only, and uploads an artifact rather than committing directly —
# thumbnails are curated on purpose, not auto-published. Capture itself IS
# deterministic (islands with randomness read `?seed=`, this job always
# passes `kgrm_s121` — see src/lib/seed.ts), so re-running it doesn't need
# repeated manual attempts to get a specific-looking result; the artifact
# step is about deliberate review before a thumbnail goes live, not about
# taming randomness.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Playground slug to capture, or 'all'"
        required: false
        default: "all"

permissions: {}

concurrency:
  group: thumbnails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # On a runner GITHUB_REPOSITORY is always set, so astro.config.mjs
      # resolves `base` to /<repo> and both the build and `astro preview` live
      # under that prefix. It cannot be turned off from here: GitHub reserves
      # the GITHUB_ prefix and re-injects those variables, so a step-level
      # `env: GITHUB_REPOSITORY: ""` silently does nothing (verified — the
      # preview still announced /playgrounds). So instead of fighting the base
      # path, the capture below is pointed at it.
      - name: Build site
        run: npm run build

      # Start and wait in ONE step. A bare `npx astro preview &` in its own
      # step dies with that step's shell, so the next step found nothing
      # listening — nohup plus redirected stdio is what detaches it for the
      # rest of the job. Failing here also dumps the server's own log, which
      # is the difference between "never came up" and knowing why.
      - name: Start preview server
        env:
          SITE_URL: http://localhost:4321/${{ github.event.repository.name }}
        run: |
          set -uo pipefail

          nohup npx astro preview --port 4321 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid

          for i in $(seq 1 60); do
            if curl -sf "$SITE_URL/" > /dev/null 2>&1; then
              echo "Preview server up after ${i}s at $SITE_URL/"
              exit 0
            fi
            # Fail fast rather than burning the full timeout on a dead process.
            if ! kill -0 "$(cat /tmp/preview.pid)" 2>/dev/null; then
              echo "Preview server exited early. Its output:" >&2
              cat /tmp/preview.log >&2
              exit 1
            fi
            sleep 1
          done

          echo "Preview server never came up. Its output:" >&2
          cat /tmp/preview.log >&2
          exit 1

      # SLUG goes through `env:` and is quoted, so a dispatched value can only
      # ever be one argv element — never spliced into the shell. The regex is
      # belt-and-braces: it also rejects a typo before Playwright spends a
      # minute failing on a URL that was never going to exist.
      - name: Capture thumbnail(s)
        env:
          # Includes the base path the build actually served under — see the
          # note on the build step above.
          PLAYGROUNDS_BASE_URL: http://localhost:4321/${{ github.event.repository.name }}
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail

          if [ -z "$SLUG" ] || [ "$SLUG" = "all" ]; then
            # The script's flag is --all; a bare "all" would be taken as a slug.
            npm run thumbnail -- --all
          else
            if ! printf '%s' "$SLUG" | grep -qE '^[a-z0-9][a-z0-9-]*$'; then
              echo "Refusing slug '$SLUG' — expected lowercase letters, digits and dashes." >&2
              exit 1
            fi
            if [ ! -f "src/content/playgrounds/${SLUG}.md" ]; then
              echo "No such playground: src/content/playgrounds/${SLUG}.md" >&2
              exit 1
            fi
            npm run thumbnail -- "$SLUG"
          fi

      - name: Upload thumbnails artifact
        uses: actions/upload-artifact@v7
        with:
          name: thumbnails-${{ github.run_number }}
          path: public/thumbnails/*.png
          retention-days: 14
